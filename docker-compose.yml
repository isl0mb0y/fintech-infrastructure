services:
  card-processing-db:
    image: postgres:16
    environment:
      POSTGRES_USER: card_processing
      POSTGRES_PASSWORD: card_processing
      POSTGRES_DB: card_processing
    ports:
      - "5433:5432"
    volumes:
      - card-processing-data:/var/lib/postgresql/data

  core-banking-db:
    image: postgres:16
    environment:
      POSTGRES_USER: core_banking
      POSTGRES_PASSWORD: core_banking
      POSTGRES_DB: core_banking
    ports:
      - "5434:5432"
    volumes:
      - core-banking-data:/var/lib/postgresql/data

volumes:
  card-processing-data:
  core-banking-data:
