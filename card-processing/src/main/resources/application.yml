server:
  port: 8081
spring:
  application:
    name: card-processing
  datasource:
    url: jdbc:postgresql://localhost:5433/card_processing
    username: card_processing
    password: card_processing

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

springdoc:
  swagger-ui:
    url: /openapi.yaml