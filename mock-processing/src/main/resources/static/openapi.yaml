openapi: 3.0.3
info:
  title: Mock Processing API
  version: 0.1.0
  description: Imitates a card processing center (Uzcard/Humo) for Payming.
servers:
  - url: http://localhost:8081
paths:
  /cards/new:
    post:
      summary: Start card binding
      description: >
        Validates the card and sends an OTP to the cardholder's phone.
        Returns a temporary id to be used in /cards/verify.
      operationId: cardNew
      tags: [Cards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardNewRequest'
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardNewResponse'
        '400':
          description: Invalid card data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Card is blocked or not found (CARD_NOT_FOUND, CARD_BLOCKED, CARD_EXPIRED, PHONE_MISMATCH)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cards/verify:
    post:
      summary: Confirm card binding with OTP
      description: >
        Verifies the OTP sent by /cards/new. On success the card is bound and
        a card token is returned; all further operations use this token.
        After 3 failed attempts the temp_id is invalidated.
      operationId: cardVerify
      tags: [Cards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardVerifyRequest'
      responses:
        '200':
          description: Card bound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: temp_id not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid or expired OTP (INVALID_OTP, OTP_EXPIRED, TOO_MANY_ATTEMPTS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cards/{token}:
    get:
      summary: Get card info and balance
      description: >
        Returns the card bound earlier via /cards/verify. Balance and available
        are current values computed on every call; the caller is responsible
        for any caching.
      operationId: cardInfo
      tags: [Cards]
      parameters:
        - name: token
          in: path
          required: true
          description: Card token returned by /cards/verify
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Card found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '404':
          description: Card not found (CARD_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /hold:
    post:
      summary: Place a hold on a card
      description: >
        Reserves the amount on the card: `available` decreases, `balance` does not
        change until the hold is confirmed. The hold expires automatically after
        10 minutes if neither confirmed nor reversed.

        Idempotent by `request_id`: a repeated request with the same `request_id`
        returns the original response and does not create a second hold. The same
        `request_id` with a different `amount` or `card_token` is rejected with 409.
      operationId: holdCreate
      tags: [Holds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldRequest'
      responses:
        '200':
          description: Hold placed (or already existed for this request_id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Card not found (CARD_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: request_id already used with different parameters (REQUEST_ID_CONFLICT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Business rejection (INSUFFICIENT_FUNDS, CARD_BLOCKED, LIMIT_EXCEEDED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /hold/{id}/confirm:
    post:
      summary: Confirm a hold
      description: >
        Finalizes the hold: `balance` decreases by the hold amount. Idempotent:
        confirming an already CONFIRMED hold returns 200 with the same hold and
        does not debit the card twice. An EXPIRED or REVERSED hold cannot be
        confirmed.
      operationId: holdConfirm
      tags: [Holds]
      parameters:
        - name: id
          in: path
          required: true
          description: hold_id returned by /hold
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Hold confirmed (or was already confirmed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '404':
          description: Hold not found (HOLD_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Hold is not ACTIVE (HOLD_EXPIRED, HOLD_REVERSED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    CardNewRequest:
      type: object
      required: [pan, expiry, phone]
      properties:
        pan:
          type: string
          pattern: '^[0-9]{16}$'
          example: '8600123412341234'
        expiry:
          type: string
          description: MM/YY
          pattern: '^(0[1-9]|1[0-2])/[0-9]{2}$'
          example: '12/28'
        phone:
          type: string
          pattern: '^\+998[0-9]{9}$'
          example: '+998991234567'
          description: Cardholder phone; must match the phone registered for the card

    CardNewResponse:
      type: object
      required: [temp_id, phone_mask, otp_expires_at]
      properties:
        temp_id:
          type: string
          format: uuid
        phone_mask:
          type: string
          description: Masked phone the OTP was sent to
          example: '+99890***1234'
        otp_expires_at:
          type: string
          format: date-time

    CardVerifyRequest:
      type: object
      required: [temp_id, otp]
      properties:
        temp_id:
          type: string
          format: uuid
        otp:
          type: string
          pattern: '^[0-9]{6}$'
          example: '123456'

    Card:
      type: object
      required: [token, masked_pan, owner, network, expiry, balance, available, status]
      properties:
        token:
          type: string
          format: uuid
          description: Card token. The caller stores this instead of the PAN.
        masked_pan:
          type: string
          description: First 6 and last 4 digits of PAN
          example: '860012******1234'
        owner:
          type: string
          description: Cardholder name as printed on the card
          example: 'A. ALIYEV'
        network:
          type: string
          enum: [UZCARD, HUMO]
        expiry:
          type: string
          description: MM/YY
          example: '12/28'
        balance:
          type: integer
          format: int64
          description: Total balance in tiyin (1 UZS = 100 tiyin)
          example: 150000000
        available:
          type: integer
          format: int64
          description: Balance minus active holds, in tiyin
          example: 149500000
        status:
          type: string
          enum: [ACTIVE, BLOCKED]

    HoldRequest:
      type: object
      required: [request_id, card_token, amount]
      properties:
        request_id:
          type: string
          format: uuid
          description: Caller-generated idempotency key, unique per hold attempt
        card_token:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Amount in tiyin
          example: 3000000

    Hold:
      type: object
      required: [hold_id, request_id, processing_tx_id, card_token, amount, status, created_at, expires_at]
      properties:
        hold_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        processing_tx_id:
          type: string
          example: 'UZ-20261023-000123'
          description: Processing-side transaction id, used in the daily registry
        card_token:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          description: Amount in tiyin
        status:
          type: string
          enum: [ACTIVE, CONFIRMED, REVERSED, EXPIRED]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: After this moment an ACTIVE hold is reversed automatically

    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: CARD_BLOCKED
        message:
          type: string
          example: Card is blocked by issuer
        retryable:
          type: boolean
          description: Whether the caller may retry the same request
