openapi: 3.0.3
info:
  title: Mock Processing API
  version: 0.1.0
  description: Imitates a card processing center (Uzcard/Humo) for Payming.
servers:
  - url: http://localhost:8081
paths:
  /cards/new:
    post:
      summary: Start card binding
      description: >
        Validates the card and sends an OTP to the cardholder's phone.
        Returns a temporary id to be used in /cards/verify.
      operationId: cardNew
      tags: [Cards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardNewRequest'
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardNewResponse'
        '400':
          description: Invalid card data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Card is blocked or not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cards/verify:
    post:
      summary: Confirm card binding with OTP
      description: >
        Verifies the OTP sent by /cards/new. On success the card is bound and
        a card token is returned; all further operations use this token.
        After 3 failed attempts the temp_id is invalidated.
      operationId: cardVerify
      tags: [Cards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardVerifyRequest'
      responses:
        '200':
          description: Card bound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: temp_id not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid or expired OTP (INVALID_OTP, OTP_EXPIRED, TOO_MANY_ATTEMPTS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    CardNewRequest:
      type: object
      required: [pan, expiry]
      properties:
        pan:
          type: string
          pattern: '^[0-9]{16}$'
          example: '8600123412341234'
        expiry:
          type: string
          description: MM/YY
          pattern: '^(0[1-9]|1[0-2])/[0-9]{2}$'
          example: '12/28'

    CardNewResponse:
      type: object
      required: [temp_id, phone_mask, otp_expires_at]
      properties:
        temp_id:
          type: string
          format: uuid
        phone_mask:
          type: string
          description: Masked phone the OTP was sent to
          example: '+99890***1234'
        otp_expires_at:
          type: string
          format: date-time

    CardVerifyRequest:
      type: object
      required: [temp_id, otp]
      properties:
        temp_id:
          type: string
          format: uuid
        otp:
          type: string
          pattern: '^[0-9]{6}$'
          example: '123456'

    Card:
      type: object
      required: [token, masked_pan, owner, network, expiry, balance, available, status]
      properties:
        token:
          type: string
          format: uuid
          description: Card token. The caller stores this instead of the PAN.
        masked_pan:
          type: string
          description: First 6 and last 4 digits of PAN
          example: '860012******1234'
        owner:
          type: string
          description: Cardholder name as printed on the card
          example: 'A. ALIYEV'
        network:
          type: string
          enum: [UZCARD, HUMO]
        expiry:
          type: string
          description: MM/YY
          example: '12/28'
        balance:
          type: integer
          format: int64
          description: Total balance in tiyin (1 UZS = 100 tiyin)
          example: 150000000
        available:
          type: integer
          format: int64
          description: Balance minus active holds, in tiyin
          example: 149500000
        status:
          type: string
          enum: [ACTIVE, BLOCKED]

    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: CARD_BLOCKED
        message:
          type: string
          example: Card is blocked by issuer
        retryable:
          type: boolean
          description: Whether the caller may retry the same request
